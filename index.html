<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control Docente</title>
  <style>
    :root {
      --bg: #070b13;
      --card: #0d1527;
      --border: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --presente: #10b981;
      --ausente: #ef4444;
      --tarde: #f59e0b;
      --primary: #0ea5e9;
      --input-bg: #050811;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding: 12px; padding-bottom: 85px; }

    header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .brand-title { font-size: 1.05rem; font-weight: 700; color: #fff; }
    
    .btn-undo {
      background: rgba(14, 165, 233, 0.15); border: 1px solid rgba(14, 165, 233, 0.3);
      color: #38bdf8; padding: 7px 12px; border-radius: 8px; font-size: 0.8rem;
      font-weight: 700; cursor: pointer;
    }
    .btn-undo:disabled { opacity: 0.3; cursor: not-allowed; }

    .filter-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 10px;
    }
    .filter-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--muted); }
    select, input[type="date"] {
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      width: 100%;
    }

    .stats-bar {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
    }
    .stat-val { font-size: 1.3rem; font-weight: 800; display: block; }
    .stat-lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; font-weight: 600; }
    .val-p { color: var(--presente); }
    .val-a { color: var(--ausente); }
    .val-t { color: var(--tarde); }

    .alumnos-list { display: flex; flex-direction: column; gap: 8px; }
    .alumno-row {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .alumno-info { flex: 1; min-width: 0; }
    .alumno-name { font-size: 1rem; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .alumno-sub { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

    .alumno-ctrls { display: flex; align-items: center; gap: 8px; }

    .input-nota {
      width: 50px; height: 48px; text-align: center;
      background: var(--input-bg); border: 1px solid var(--border);
      border-radius: 8px; color: #fff; font-size: 1.1rem; font-weight: 700;
      outline: none;
    }

    .btn-asist {
      width: 50px; height: 48px; border-radius: 8px; border: none;
      font-weight: 800; font-size: 1.15rem; color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .st-P { background-color: var(--presente); }
    .st-A { background-color: var(--ausente); }
    .st-T { background-color: var(--tarde); color: #000; }

    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(7, 11, 19, 0.95);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      display: flex; gap: 10px; z-index: 50;
    }
    .btn-action {
      flex: 1; padding: 12px; border-radius: 8px; border: none;
      font-weight: 700; font-size: 0.9rem; cursor: pointer;
    }
    .btn-add { background: var(--card); color: #fff; border: 1px solid var(--border); }
    .btn-sync { background: var(--primary); color: #fff; }

    #toast {
      position: fixed; bottom: 75px; left: 50%; transform: translateX(-50%);
      background: #0284c7; color: #fff; padding: 8px 16px; border-radius: 30px;
      font-size: 0.8rem; font-weight: 600; opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease; z-index: 2000;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">Control Docente</div>
    <button class="btn-undo" id="btnUndo" onclick="deshacer()" disabled>↩ Deshacer</button>
  </header>

  <div class="filter-panel">
    <div class="filter-group">
      <label>Día / Materia / Escuela</label>
      <select id="selMateria" onchange="cambiarMateria()">
        <option value="lun_tec5_so">Lunes: Lab. Sistemas Operativos (4° - Técnica 5)</option>
        <option value="mar_tec2_mpe">Martes: Montaje de Proyectos (4° - Técnica 2 Hurlingham)</option>
        <option value="mar_tec1_ea">Martes: Electrónica Analógica (4° - Técnica 1)</option>
        <option value="mie_tec2_das">Miércoles: DAS (5° - Técnica 2 Hurlingham)</option>
        <option value="mie_tec1_ea">Miércoles: Electrónica Analógica (4° - Técnica 1)</option>
        <option value="vie_tec1_mpe">Viernes Noche: Montaje de Proyectos (4° 3° - Técnica 1)</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Fecha de Clase</label>
      <input type="date" id="fechaClase" onchange="renderAlumnos()">
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-card">
      <span class="stat-val val-p" id="cntP">0</span>
      <span class="stat-lbl">Presentes</span>
    </div>
    <div class="stat-card">
      <span class="stat-val val-a" id="cntA">0</span>
      <span class="stat-lbl">Ausentes</span>
    </div>
    <div class="stat-card">
      <span class="stat-val val-t" id="cntT">0</span>
      <span class="stat-lbl">Tardes</span>
    </div>
  </div>

  <main class="alumnos-list" id="lista"></main>

  <div class="bottom-bar">
    <button class="btn-action btn-add" onclick="agregarAlumno()">+ Alumno</button>
    <button class="btn-action btn-sync" onclick="guardar()">Guardar Lista</button>
  </div>

  <div id="toast"></div>

  <script>
    const baseInicial = {
      "lun_tec5_so": [
        { id: 1, nombre: "Álvarez, Lucas", estado: "P", nota: "" },
        { id: 2, nombre: "Benítez, Diego", estado: "P", nota: "" },
        { id: 3, nombre: "Castillo, Ramiro", estado: "A", nota: "" }
      ],
      "mar_tec2_mpe": [
        { id: 4, nombre: "Díaz, Franco", estado: "P", nota: "" },
        { id: 5, nombre: "Fernández, Tomás", estado: "P", nota: "" }
      ],
      "mar_tec1_ea": [
        { id: 6, nombre: "García, Juan", estado: "P", nota: "" },
        { id: 7, nombre: "López, Matías", estado: "P", nota: "" }
      ],
      "mie_tec2_das": [
        { id: 8, nombre: "Martínez, Axel", estado: "P", nota: "" },
        { id: 9, nombre: "Navarro, Bruno", estado: "P", nota: "" }
      ],
      "mie_tec1_ea": [
        { id: 10, nombre: "Pérez, Gonzalo", estado: "P", nota: "" },
        { id: 11, nombre: "Romero, Kevin", estado: "P", nota: "" }
      ],
      "vie_tec1_mpe": [
        { id: 12, nombre: "Acosta, Mateo", estado: "P", nota: "" },
        { id: 13, nombre: "Cardozo, Sofía", estado: "P", nota: "" },
        { id: 14, nombre: "Sosa, Valentín", estado: "P", nota: "" }
      ]
    };

    let base = JSON.parse(localStorage.getItem("registro_docente_simple")) || baseInicial;
    let historial = [];

    document.getElementById("fechaClase").value = new Date().toISOString().split("T")[0];
    let materiaActual = document.getElementById("selMateria").value;

    function renderAlumnos() {
      const contenedor = document.getElementById("lista");
      contenedor.innerHTML = "";
      const lista = base[materiaActual] || [];

      let cp = 0, ca = 0, ct = 0;

      lista.forEach((al, idx) => {
        if (al.estado === "P") cp++;
        if (al.estado === "A") ca++;
        if (al.estado === "T") ct++;

        const row = document.createElement("div");
        row.className = "alumno-row";
        row.innerHTML = `
          <div class="alumno-info">
            <div class="alumno-name">${al.nombre}</div>
            <div class="alumno-sub">#${idx + 1}</div>
          </div>
          <div class="alumno-ctrls">
            <input type="text" 
                   class="input-nota" 
                   inputmode="numeric" 
                   placeholder="-" 
                   value="${al.nota || ''}" 
                   onfocus="this.dataset.old = this.value"
                   onchange="modificarNota(this, ${idx})">
            <button class="btn-asist st-${al.estado}" 
                    onclick="cambiarAsistencia(${idx})">${al.estado}</button>
          </div>
        `;
        contenedor.appendChild(row);
      });

      document.getElementById("cntP").textContent = cp;
      document.getElementById("cntA").textContent = ca;
      document.getElementById("cntT").textContent = ct;

      localStorage.setItem("registro_docente_simple", JSON.stringify(base));
      document.getElementById("btnUndo").disabled = (historial.length === 0);
    }

    function cambiarAsistencia(idx) {
      const ciclo = ["P", "A", "T"];
      const alumno = base[materiaActual][idx];
      const estadoViejo = alumno.estado;
      const estadoNuevo = ciclo[(ciclo.indexOf(estadoViejo) + 1) % ciclo.length];

      historial.push({
        tipo: "asistencia",
        materia: materiaActual,
        idx: idx,
        anterior: estadoViejo,
        nombre: alumno.nombre
      });

      alumno.estado = estadoNuevo;
      renderAlumnos();
    }

    function modificarNota(input, idx) {
      const alumno = base[materiaActual][idx];
      const notaVieja = input.dataset.old || alumno.nota || "";
      let val = input.value.trim().replace(",", ".");

      if (val === "") {
        if (notaVieja !== "") {
          historial.push({ tipo: "nota", materia: materiaActual, idx: idx, anterior: notaVieja, nombre: alumno.nombre });
          alumno.nota = "";
          renderAlumnos();
        }
        return;
      }

      let n = parseFloat(val);
      if (isNaN(n) || n < 1 || n > 10) {
        toast("⚠️ Ingresá una nota válida (1 a 10)");
        input.value = notaVieja;
      } else {
        const nStr = n.toString();
        if (nStr !== notaVieja) {
          historial.push({ tipo: "nota", materia: materiaActual, idx: idx, anterior: notaVieja, nombre: alumno.nombre });
          alumno.nota = nStr;
          toast(`Nota guardada: ${nStr}`);
          renderAlumnos();
        }
      }
    }

    function deshacer() {
      if (historial.length === 0) return;
      const accion = historial.pop();

      if (accion.tipo === "asistencia") {
        base[accion.materia][accion.idx].estado = accion.anterior;
        toast(`↩ ${accion.nombre}: volvió a ${accion.anterior}`);
      } else if (accion.tipo === "nota") {
        base[accion.materia][accion.idx].nota = accion.anterior;
        toast(`↩ ${accion.nombre}: nota restaurada`);
      }
      renderAlumnos();
    }

    function cambiarMateria() {
      materiaActual = document.getElementById("selMateria").value;
      renderAlumnos();
    }

    function agregarAlumno() {
      const nom = prompt("Apellido y Nombre del alumno:");
      if (nom && nom.trim()) {
        if (!base[materiaActual]) base[materiaActual] = [];
        base[materiaActual].push({ id: Date.now(), nombre: nom.trim(), estado: "P", nota: "" });
        renderAlumnos();
        toast("Alumno agregado");
      }
    }

    function guardar() {
      localStorage.setItem("registro_docente_simple", JSON.stringify(base));
      toast("¡Lista guardada!");
    }

    function toast(txt) {
      const t = document.getElementById("toast");
      t.textContent = txt;
      t.style.opacity = "1";
      setTimeout(() => { t.style.opacity = "0"; }, 2000);
    }

    renderAlumnos();
  </script>
</body>
</html>
